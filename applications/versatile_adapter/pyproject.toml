[project]
name = "versatile-adapter"
version = "1.0.0"
description = "Versatile 低代码平台 A2A 适配器"
requires-python = ">=3.11"

dependencies = [
    # A2A SDK 1.0.0
    "a2a-sdk[http-server]==1.0.0",

    # HTTP 客户端（调用 Versatile 平台）
    "httpx>=0.27",

    # Web 框架
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",

    # 配置管理
    "pydantic-settings>=2.3",

    # 日志
    "loguru>=0.7",

    # protobuf（a2a-sdk 依赖，显式声明）
    "protobuf>=4.25",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["common", "adapter"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
