[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lowcode-agent-runner"
version = "0.1.0"
description = "Lowcode Agent Runner - 从导出的 JSON 配置加载并运行 Agent"
requires-python = ">=3.11.4"
dependencies = [
    "openjiuwen[chromadb,obs]==0.1.10",
    "fastapi==0.115.11",
    "uvicorn[standard]==0.42.0",
    "pydantic==2.11.7",
    "pydantic[email]==2.11.7",
    "pydantic-settings==2.5.2",
    "openjiuwen-studio==0.1.7",
    "openjiuwen-runtime-service==0.1.0"
]

[project.scripts]
lowcode-agent-runner = "openjiuwen_runtime.examples.lowcode_agent.__main__:main"

[tool.uv]
default-groups = ['dev']

[dependency-groups]
dev = [
    "coverage==7.8.0",
    "pytest==8.3.5",
    "pytest-asyncio==1.2.0",
    "pytest-mock==3.14.0",
    "ruff==0.9.10",
]

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"

[tool.setuptools.packages.find]
where = ["."]
exclude = ["*.egg-info", "tests"]
include = ["openjiuwen_runtime*"]
