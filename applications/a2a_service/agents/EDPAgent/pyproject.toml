[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "EDPAgent"
version = "0.1.0"
description = "动态规划智能体 — 零 A2A 依赖的 Python 包"
requires-python = ">=3.11"
dependencies = [
    # OpenJiuwen 核心框架（含 Redis Checkpointer 扩展）
    "openjiuwen[redis]>=0.1.9",
    # 数据验证
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    # 日志
    "loguru>=0.7.0",
    # 注意：无 a2a-sdk，无 httpx，无 fastapi
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.hatch.build.targets.wheel]
packages = ["EDPAgent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
