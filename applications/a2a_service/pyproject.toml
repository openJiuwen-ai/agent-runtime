[project]
name = "a2a-service"
version = "1.0.0"
description = "DPA × VersatileAdapter A2A 用户服务主入口"
requires-python = ">=3.11"

dependencies = [
    # A2A SDK 1.0.0
    "a2a-sdk==1.0.0",

    # HTTP 客户端（调用 VersatileAdapter A2A 接口）
    "httpx>=0.27",

    # Web 框架
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",

    # Redis 异步客户端
    "redis[asyncio]>=5.0",

    # 配置管理
    "pydantic-settings>=2.3",
    # .env → os.environ 同步（代理变量需对 httpx 生效）
    "python-dotenv>=1.0",

    # 日志
    "loguru>=0.7",

    # 配置加解密（common.crypto）
    "pycryptodome>=3.20.0",

    # protobuf（common.task_store_adapter 序列化 A2A Task）
    "protobuf>=5.29.5",

    # SQLAlchemy（common.data_store_factory 构建 DB handler）
    "sqlalchemy[asyncio]>=2.0.0",

    # 平台层基础能力（common/data_store_factory、db_data_store、cache_backed_data_store
    # 顶层 import openjiuwen_runtime.foundation.*；SDK 日志清理等）。硬 import 依赖，两处同步：
    # 部署镜像由 agent-store deployment/Dockerfile 的 uv pip install 清单装入（镜像构建不读本文件）。
    "openjiuwen-runtime-foundation>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx",
    # OTel 轨迹上报（编排层 span 经 agents.EDPAgent.otel_span_helper 复用 EDPAgent 的 TracerProvider）。
    # 仅 API（SpanKind/propagate），不含 SDK/exporter——SDK 与 otlp 导出由 openjiuwen[observability]
    # 在 deployment 镜像内带入。a2a_service 主 dependencies 不列，与 openjiuwen 同 posture（懒导入+镜像提供）。
    "opentelemetry-api>=1.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["common", "orchestrator"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
