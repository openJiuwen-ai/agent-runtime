[project]
name = "a2a-service"
version = "1.0.0"
description = "DPA × VersatileAdapter A2A 用户服务主入口"
requires-python = ">=3.11"

dependencies = [
    # A2A SDK 1.0.0
    "a2a-sdk==1.0.0",

    # HTTP 客户端（调用 VersatileAdapter A2A 接口）
    "httpx>=0.27",

    # Web 框架
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",

    # Redis 异步客户端
    "redis[asyncio]>=5.0",

    # 配置管理
    "pydantic-settings>=2.3",

    # 日志
    "loguru>=0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["common", "orchestrator"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
