[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
# 重构:原 jiuwenclaw-identity,迁入 runtime 后改名为 identity-center
name = "identity-center"
version = "0.1.0"
description = "JiuwenClaw identity / auth service (OAuth2 + JWT, standalone identity DB)"
requires-python = ">=3.11.4,<3.14"
license = { text = "Apache-2.0" }
classifiers = [
    "License :: OSI Approved :: Apache Software License",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "structlog>=24.0",
    "PyJWT>=2.8",
    "cryptography>=42.0",
    "python-multipart>=0.0.9",
    # 重构:foundation 由 git 源(agent-runtime@develop)改为本仓源码,见 [tool.uv.sources]
    "openjiuwen-runtime-foundation",
    "asyncpg>=0.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.6",
]

[project.scripts]
identity-center = "identity_center.main:main"

# 重构:foundation 改用本仓 editable 源码,不再从 gitcode 拉取
[tool.uv.sources]
openjiuwen-runtime-foundation = { path = "../../../foundation", editable = true }

[tool.setuptools.packages.find]
where = ["src"]
include = ["identity_center*"]
