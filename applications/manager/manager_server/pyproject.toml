[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
# 重构:原 jiuwenclaw-manager (Claw Manager),迁入 runtime 后改名 manager-server
name = "manager-server"
version = "0.1.0"
description = "Agent manager server (management plane)"
requires-python = ">=3.11.4,<3.14"
license = { text = "Apache-2.0" }
classifiers = [
    "License :: OSI Approved :: Apache Software License",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "httpx>=0.27",
    "structlog>=24.0",
    "pyyaml>=6.0",
    # 重构:foundation 由 git 源(agent-runtime@develop)改为本仓源码,见 [tool.uv.sources]
    "openjiuwen-runtime-foundation",
    "websockets>=12.0,<16",
    "asyncpg>=0.29",
    "cryptography>=42.0",
    "croniter>=2.0",
    "PyJWT>=2.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.6",
]

# 重构:foundation 改用本仓 editable 源码,不再从 gitcode 拉取
[tool.uv.sources]
openjiuwen-runtime-foundation = { path = "../../../foundation", editable = true }

[project.scripts]
manager-server = "manager_server.main:main"
manager-start = "manager_server.start_services:main"
manager-web = "manager_server.manager_web:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["manager_server*"]

[tool.ruff]
src = ["src"]
line-length = 100
