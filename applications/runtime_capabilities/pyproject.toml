[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "runtime-capabilities"
version = "0.1.0"
description = "Deployable application for validating OpenJiuwen Runtime capabilities"
requires-python = ">=3.11.4"
dependencies = [
    "openjiuwen-runtime-foundation==0.1.0",
    "openjiuwen-runtime-service==0.1.0",
    "pydantic==2.11.7",
    "python-dotenv>=1.0.0",
    "uvicorn[standard]==0.42.0",
]

[project.optional-dependencies]
local = [
    "fakeredis>=2.20",
]
server = [
    "kubernetes_asyncio==35.0.0",
]

[project.scripts]
runtime-capabilities = "runtime_capabilities.cli:main"

[dependency-groups]
dev = [
    "fakeredis>=2.20",
    "httpx>=0.27",
    "pytest==8.3.5",
    "pytest-asyncio==1.2.0",
    "pytest-mock==3.14.0",
    "ruff==0.9.10",
]

[tool.uv]
default-groups = ["dev"]

[tool.uv.sources]
openjiuwen-runtime-foundation = { path = "../../foundation", editable = true }
openjiuwen-runtime-service = { path = "../../service", editable = true }

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"

[tool.setuptools.packages.find]
where = ["src"]
include = ["runtime_capabilities*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "unit: isolated application tests",
    "system: end-to-end HTTP application tests",
]
