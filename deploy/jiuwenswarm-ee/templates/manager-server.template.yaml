# Service：提供稳定 DNS 域名, 供集群内部访问
apiVersion: v1
kind: Service
metadata:
  name: <<MANAGER_SERVER_NAME>>
  namespace: <<NAMESPACE>>
spec:
  selector:
    app: <<MANAGER_SERVER_NAME>>
  ports:
    - name: rest
      port: <<MANAGER_REST_PORT>>
      targetPort: <<MANAGER_REST_PORT>>
    - name: websocket
      port: <<MANAGER_WS_PORT>>
      targetPort: <<MANAGER_WS_PORT>>
  type: ClusterIP                             # 集群内部访问，不需要外网

---
# NodePort Service：供集群外部连接
apiVersion: v1
kind: Service
metadata:
  name: <<MANAGER_SERVER_NAME>>-nodeport
  namespace: <<NAMESPACE>>
spec:
  type: NodePort
  ports:
    - name: rest
      port: <<MANAGER_REST_PORT>>       # 集群内部端口
      targetPort: <<MANAGER_REST_PORT>> # 容器端口
      nodePort: <<MANAGER_SERVER_NODE_PORT>>   # 外部访问端口（30000-32767）
  selector:
    app: <<MANAGER_SERVER_NAME>>

---
# 连接状态页只读库存：本 ns Pod list + kubelet Summary（nodes/proxy；不依赖 metrics-server）
# imagePullSecrets：部署后请从同 ns default SA 同步，避免私有仓库拉取失败
apiVersion: v1
kind: ServiceAccount
metadata:
  name: <<MANAGER_SERVER_NAME>>-sa
  namespace: <<NAMESPACE>>
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: <<MANAGER_SERVER_NAME>>-inventory
  namespace: <<NAMESPACE>>
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: <<MANAGER_SERVER_NAME>>-inventory
  namespace: <<NAMESPACE>>
subjects:
  - kind: ServiceAccount
    name: <<MANAGER_SERVER_NAME>>-sa
    namespace: <<NAMESPACE>>
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: <<MANAGER_SERVER_NAME>>-inventory
---
# Summary 用量：nodes/proxy（RBAC 无法限到 /stats/summary；仅授予 get）
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: <<MANAGER_SERVER_NAME>>-kubelet-summary-<<NAMESPACE>>
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["nodes/proxy"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: <<MANAGER_SERVER_NAME>>-kubelet-summary-<<NAMESPACE>>
subjects:
  - kind: ServiceAccount
    name: <<MANAGER_SERVER_NAME>>-sa
    namespace: <<NAMESPACE>>
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: <<MANAGER_SERVER_NAME>>-kubelet-summary-<<NAMESPACE>>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: <<MANAGER_SERVER_NAME>>
  namespace: <<NAMESPACE>>
spec:
  replicas: <<MANAGER_SERVER_REPLICAS>>
  selector:
    matchLabels:
      app: <<MANAGER_SERVER_NAME>>
  template:
    metadata:
      labels:
        app: <<MANAGER_SERVER_NAME>>
    spec:
      serviceAccountName: <<MANAGER_SERVER_NAME>>-sa
      securityContext:
        fsGroup: <<SWARM_FS_GROUP>>
      volumes:
        - name: web-probe-ca
          configMap:
            name: jiuwenswarm-web-probe-ca
            optional: true
      containers:
      - name: manager
        volumeMounts:
        - name: web-probe-ca
          mountPath: /etc/manager/web-probe-ca
          readOnly: true
        image: <<MANAGER_SERVER_IMAGE>>
        securityContext:
          runAsUser: <<SWARM_USER>>
          runAsGroup: <<SWARM_GROUP>>
        ports:
        - name: rest
          containerPort: <<MANAGER_REST_PORT>>
        - name: websocket
          containerPort: <<MANAGER_WS_PORT>>
        envFrom:
            - secretRef:
                name: <<SECRET_CM_NAME>>
        env:
        - name: REDIS_URL
          value: "<<REDIS_URL>>"
        - name: REDIS_USER
          value: "<<REDIS_USER>>"
        - name: REDIS_KEY_PREFIX
          value: "<<REDIS_KEY_PREFIX>>"
        - name: MANAGER_RABBITMQ_URL
          value: "<<MANAGER_RABBITMQ_URL>>"
        - name: MANAGER_REST_HOST
          value: "0.0.0.0"
        - name: MANAGER_REST_PORT
          value: "<<MANAGER_REST_PORT>>"
        - name: MANAGER_AGENT_CLIENT_REGISTRATION_ENABLED
          value: "<<MANAGER_AGENT_CLIENT_REGISTRATION_ENABLED>>"
        - name: MANAGER_AGENT_CLIENT_REGISTRATION_CONFIG_FILE
          value: "<<MANAGER_AGENT_CLIENT_REGISTRATION_CONFIG_FILE>>"
        - name: MANAGER_DB_TYPE
          value: "<<DB_TYPE>>"
        - name: MANAGER_DB_HOST
          value: "<<DB_HOST>>"
        - name: MANAGER_DB_PORT
          value: "<<DB_PORT>>"
        - name: MANAGER_DB_USER
          value: "<<MANAGER_DB_USER>>"
        - name: MANAGER_DB_NAME
          value: "<<MANAGER_DB_NAME>>"
        - name: IDENTITY_PUBLIC_KEY_URL
          value: "http://<<IDENTITY_NAME>>:<<IDENTITY_REST_PORT>>/v1/auth/public_key"
        # nginx 变量 proxy_pass 需 FQDN；短名作回退时由 Manager 扩成 *.svc.cluster.local
        - name: MANAGER_WEB_GATEWAY_HTTP_TARGET
          value: "http://<<GATEWAY_NAME>>.<<NAMESPACE>>.svc.cluster.local:<<WEB_PORT>>"
        - name: MANAGER_WEB_GATEWAY_WS_TARGET
          value: "http://<<GATEWAY_NAME>>.<<NAMESPACE>>.svc.cluster.local:<<WEB_PORT>>"
        - name: NAMESPACE
          value: "<<NAMESPACE>>"
        - name: AGENT_RUNTIME_SYNC_TIMEOUT
          value: "<<AGENT_RUNTIME_SYNC_TIMEOUT>>"
        - name: WORKSPACE_QUOTA_ENABLED
          value: "<<WORKSPACE_QUOTA_ENABLED>>"
        # 技能上传审批：manager 按 object_key 直读原始包（凭据复用 AgentServer 的 AK/SK）
        - name: OBS_URL
          value: "<<OBS_URL>>"
        - name: OBS_BUCKET
          value: "<<OBS_BUCKET>>"
        - name: OBS_ACCESS_KEY
          value: "<<OBS_ACCESS_KEY>>"
        - name: OBS_REGION
          value: "<<OBS_REGION>>"
        - name: OBS_SECURE
          value: "<<OBS_SECURE>>"
        # 包保留天数：与 AgentServer 必须同值，默认 7，最小 1
        - name: SKILL_UPLOAD_RETENTION_DAYS
          value: "<<SKILL_UPLOAD_RETENTION_DAYS>>"
        - name: MANAGER_WS_ENABLED
          value: "true"
        - name: MANAGER_WS_HOST
          value: "0.0.0.0"
        - name: MANAGER_WS_PORT
          value: "<<MANAGER_WS_PORT>>"
        - name: TZ
          value: "<<TIMEZONE>>"
