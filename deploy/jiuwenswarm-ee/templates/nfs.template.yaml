# 内置 NFS server（./deploy.sh up nfs，仅 CLUSTER_TYPE=k8s）：hostNetwork 监听 2049/111，
# 固定调度到运行部署工具的节点，导出根为该节点 hostPath（NFS_HOST_PATH）。
# 导出约定：/exports 整根导出（fsid=0），组件消费侧按 <NFS_SHARE_PATH>/<NAMESPACE>/<组件>
# 建目录直连挂载（k8s_handler.sh prepare_nfs_path 经 NFS_POD_PATH 进入 Pod 内建目录）。
# 命名空间规则与 mariadb 等基础服务一致（部署落 NAMESPACE，消费按 本 ns → BASE_SVC_NS
# 定位，k8s_handler.sh builtin_nfs_pod）；hostNetwork 绑定节点 2049 端口，全集群仅能
# 存活一套——请勿在多个命名空间重复部署，共享实例推荐 -n default。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: <<NFS_NAME>>
  namespace: <<NAMESPACE>>
  labels:
    app: <<NFS_NAME>>
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: <<NFS_NAME>>
  template:
    metadata:
      labels:
        app: <<NFS_NAME>>
    spec:
      # 固定调度到部署节点：导出根 hostPath 与数据目录都在该节点本地。
      # CURRENT_NODE_NAME 由 fetch_current_node_name 解析（up 时强制识别）；
      # --render-only 离线渲染无法识别时本行整行删除 → Pod 可调度到任意节点，
      # hostPath 数据随节点漂移（apply_nfs_extras 会告警，正式部署须重新渲染）
      nodeName: <<CURRENT_NODE_NAME>>
      hostNetwork: true
      containers:
        - name: <<NFS_NAME>>
          image: <<NFS_IMAGE>>
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: true
          env:
            - name: NFS_DISABLE_VERSION_3
              value: "1"
            - name: NFS_EXPORT_0
              value: "/exports *(rw,sync,no_subtree_check,no_root_squash,fsid=0,insecure)"
          ports:
            - containerPort: 2049
              name: nfs
            - containerPort: 111
              name: rpcbind
          volumeMounts:
            - name: nfs-storage
              mountPath: <<NFS_POD_PATH>>
      volumes:
        - name: nfs-storage
          hostPath:
            path: <<NFS_HOST_PATH>>
            type: DirectoryOrCreate
