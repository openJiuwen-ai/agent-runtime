# jiuwenswarm-agentserver 部署清单（镜像 <<AGENTSERVER_IMAGE>>，与 gateway 同镜像）
# 说明：
#   - 镜像为 OpenShift 适配版，适配 restricted-v2 SCC（强制随机 uid，不指定 runAsUser/fsGroup）
#   - 配置经 Secret jiuwenswarm-secret-configmap 与 ConfigMap jiuwenswarm-agentserver-env 注入
#   - 数据卷挂载（profile 分层契约，见 jiuwenswarm/common/paths.py）：
#     · 共享卷 PVC jiuwenswarm-pvc → /home/app/.jiuwenswarm/profile：统一用户数据目录
#       （agent/、runtime_state/、profile_{tk}/（旧 workspace_{tk}）、application_plugins/、
#       .personal_context/ 等），跨 agent server Pod 共享（租户会话可能落在任意 pod，必须全局可见）
#     · 系统态（run/、config/、logs/、runtime/、auth/、.trace/ 等）保持数据根原位：
#       不挂卷、不共享，随 Pod 生命周期
#   - 数据根 /home/app/.jiuwenswarm 自身不挂载（Pod 本地存储），仅 profile/ 经共享卷挂载
#   - StatefulSet + headless Service：每 Pod 稳定 DNS
#     jiuwenswarm-agentserver-{i}.jiuwenswarm-agentserver-headless.<ns>.svc.cluster.local
#     （Pod 重建后 IP 变、DNS 不变，健康探测与会话路由地址跨重启稳定）
#   - 内部组件：off 模式 gateway 经 AGENT_SERVER_URL 通过 ClusterIP Service 直连，不对外暴露
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: jiuwenswarm-agentserver
  namespace: "<<NAMESPACE>>"
  labels:
    app: jiuwenswarm-agentserver
spec:
  replicas: <<AGENT_SERVER_REPLICAS>>
  serviceName: jiuwenswarm-agentserver-headless
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: jiuwenswarm-agentserver
  template:
    metadata:
      labels:
        app: jiuwenswarm-agentserver
        jiuwenswarm-component: agentserver
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - jiuwenswarm-agentserver
                topologyKey: "kubernetes.io/hostname"
      containers:
        - name: jiuwenswarm-agentserver
          image: <<AGENTSERVER_IMAGE>>
          imagePullPolicy: IfNotPresent
          ports:
            - name: sse
              containerPort: 8766
            - name: ws
              containerPort: 18092
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: sse
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: sse
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 6
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          envFrom:
            - secretRef:
                name: jiuwenswarm-secret-configmap
            - configMapRef:
                name: jiuwenswarm-agentserver-env
          volumeMounts:
            - name: agentserver-data
              mountPath: /home/app/.jiuwenswarm/profile
      volumes:
        - name: agentserver-data
          persistentVolumeClaim:
            claimName: jiuwenswarm-pvc
---
# headless Service：StatefulSet 治理服务（clusterIP: None），提供每 Pod 稳定 DNS
apiVersion: v1
kind: Service
metadata:
  name: jiuwenswarm-agentserver-headless
  namespace: "<<NAMESPACE>>"
spec:
  clusterIP: None
  selector:
    app: jiuwenswarm-agentserver
  ports:
    - name: sse
      port: 8766
      targetPort: sse
    - name: ws
      port: 18092
      targetPort: ws
---
# Service：提供稳定 DNS 域名，gateway 静态模式经 AGENT_SERVER_URL 直连
apiVersion: v1
kind: Service
metadata:
  name: jiuwenswarm-agentserver
  namespace: "<<NAMESPACE>>"
spec:
  selector:
    app: jiuwenswarm-agentserver
  ports:
    - name: sse
      port: 8766
      targetPort: sse
    - name: ws
      port: 18092
      targetPort: ws
  type: ClusterIP
