apiVersion: apps/v1
kind: Deployment
metadata:
  name: <<AGENT_SERVER_NAME>>
  namespace: <<NAMESPACE>>
  labels:
    app: <<AGENT_SERVER_NAME>>
spec:
  replicas: <<AGENT_SERVER_REPLICAS>>
  selector:
    matchLabels:
      app: <<AGENT_SERVER_NAME>>
  template:
    metadata:
      labels:
        app: <<AGENT_SERVER_NAME>>
        jiuwenswarm-component: agentserver
    spec:
      securityContext:
        fsGroup: <<SWARM_FS_GROUP>>
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - <<AGENT_SERVER_NAME>>
              topologyKey: "kubernetes.io/hostname"
      containers:
        - name: <<AGENT_SERVER_NAME>>
          image: <<AGENT_SERVER_IMAGE>>
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: <<SWARM_USER>>
            runAsGroup: <<SWARM_GROUP>>
          ports:
            - name: sse
              containerPort: <<AGENT_SERVER_HTTP_PORT>>
            - name: ws
              containerPort: <<AGENT_SERVER_WS_PORT>>
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: sse
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: sse
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 6
          envFrom:
            - secretRef:
                name: <<SECRET_CM_NAME>>
            - configMapRef:
                name: <<AGENT_SERVER_ENV_CM_NAME>>
          volumeMounts:
            - name: data
              mountPath: <<SWARM_HOME>>/.jiuwenswarm
        # jiuwenbox 沙箱 sidecar：JIUWENBOX_ENABLED=false 时由 agentserver_handler 整体移除
        - name: <<JIUWENBOX_NAME>>
          image: <<JIUWENBOX_IMAGE>>
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: <<JIUWENBOX_PORT>>
          env:
            - name: JIUWENBOX_LISTEN
              value: "http://0.0.0.0:<<JIUWENBOX_PORT>>"
            - name: JIUWENBOX_POLICY_PATH
              value: "<<SWARM_POD_CODE_PATH>>/jiuwenbox/src/jiuwenbox/configs/enterprise-policy.yaml"
            - name: TZ
              value: "<<TIMEZONE>>"
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            capabilities:
              add:
              - SYS_ADMIN
              - NET_ADMIN
            seccompProfile:
              type: Unconfined
          readinessProbe:
            tcpSocket:
              port: <<JIUWENBOX_PORT>>
            initialDelaySeconds: 10
            periodSeconds: 5
          volumeMounts:
            - name: hp-cgroup
              mountPath: /sys/fs/cgroup
            - name: data
              mountPath: <<SWARM_HOME>>/.jiuwenswarm
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: <<SWARM_PVC>>
        - name: hp-cgroup
          hostPath:
            path: /sys/fs/cgroup
            type: Directory

---
# Service：提供稳定 DNS 域名，gateway 静态模式经 AGENT_SERVER_URL 直连
apiVersion: v1
kind: Service
metadata:
  name: <<AGENT_SERVER_NAME>>
  namespace: <<NAMESPACE>>
spec:
  selector:
    app: <<AGENT_SERVER_NAME>>
  ports:
    - name: sse
      port: <<AGENT_SERVER_HTTP_PORT>>
      targetPort: sse
    - name: ws
      port: <<AGENT_SERVER_WS_PORT>>
      targetPort: ws
  type: ClusterIP
