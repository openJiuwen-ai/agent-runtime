# Headless Service：给 StatefulSet 提供稳定 DNS 域名
apiVersion: v1
kind: Service
metadata:
  name: <<MARIADB_NAME>>-headless
spec:
  ports:
    - port: 3306
      targetPort: 3306
  clusterIP: None  # 关键：无头服务，StatefulSet 必须依赖
  selector:
    app: <<MARIADB_NAME>>

---
# NodePort Service：供外部工具连接 MariaDB
apiVersion: v1
kind: Service
metadata:
  name: <<MARIADB_NAME>>-nodeport
spec:
  type: NodePort
  ports:
    - port: 3306       # 集群内部端口
      targetPort: 3306 # 容器端口
      nodePort: <<MARIADB_NODE_PORT>>  # 外部访问端口（30000-32767）
  selector:
    app: <<MARIADB_NAME>>

---
# StatefulSet：MariaDB 有状态应用（稳定网络 + 稳定存储）
# 与 MySQL 协议兼容：应用侧 DB_TYPE 由 check_if_db_up 归一化为 mysql
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: <<MARIADB_NAME>>
spec:
  serviceName: <<MARIADB_NAME>>-headless  # 绑定 Headless Service
  replicas: 1
  selector:
    matchLabels:
      app: <<MARIADB_NAME>>
  template:
    metadata:
      labels:
        app: <<MARIADB_NAME>>
    spec:
      containers:
        - name: <<MARIADB_NAME>>
          image: <<MARIADB_IMAGE>>
          imagePullPolicy: IfNotPresent
          args:
            - --innodb_use_native_aio=0
            - --innodb_flush_method=O_DIRECT_NO_FSYNC
            - --max-connections=<<MARIADB_MAX_CONNECTION>>
          env:
            - name: MARIADB_ROOT_PASSWORD
              value: "<<MARIADB_ROOT_PASSWORD>>"  # 生产环境请务必修改！
            - name: TZ
              value: "<<TIMEZONE>>"
            - name: MARIADB_ROOT_HOST
              value: "%"              # 允许 root 从任意地址登录（外部工具可用）
          ports:
            - containerPort: 3306
              name: <<MARIADB_NAME>>
          volumeMounts:
            - name: <<MARIADB_NAME>>-data
              mountPath: /var/lib/mysql
          livenessProbe:
            tcpSocket:
              port: 3306
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            tcpSocket:
              port: 3306
            initialDelaySeconds: 20
            periodSeconds: 5
            timeoutSeconds: 2
      volumes:
        - name: <<MARIADB_NAME>>-data
          persistentVolumeClaim:
            claimName: <<MARIADB_NAME>>-pvc

---
# PV 持久化存储
apiVersion: v1
kind: PersistentVolume
metadata:
  name: <<MARIADB_NAME>>-pv
  labels:
    app: <<MARIADB_NAME>>
spec:
  capacity:
    storage: <<MARIADB_STORAGE_SIZE>>
  accessModes:
    - ReadWriteOnce                       # RWX: 多个 Pod 可同时读写
  persistentVolumeReclaimPolicy: Retain   # 删除 PVC 时保留数据
  storageClassName: ""                    # 不使用 StorageClass
  nfs:
    server: <<NFS_SERVER_ADDR>>                    # NFS 服务器地址
    path: <<NFS_SHARE_PATH>>/<<MARIADB_NAME>>      # NFS 共享路径
    readOnly: false
  mountOptions:
    - nfsvers=4
    - soft        # 改成 soft！防止节点卡死
    - timeo=600   # 超时时间：60秒
    - retrans=2   # 重试2次
    - noatime

---
# PVC 持久化存储（自动绑定 PV）
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: <<MARIADB_NAME>>-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: <<MARIADB_STORAGE_SIZE>>
  storageClassName: ""       # 不使用 StorageClass
  selector:
    matchLabels:
      app: <<MARIADB_NAME>>
