# jiuwenswarm-gateway 部署清单（镜像 <<GATEWAY_IMAGE>>）
# 说明：
#   - 镜像为 OpenShift 适配版，适配 restricted-v2 SCC（强制随机 uid，不指定 runAsUser/fsGroup）
#   - 配置经 Secret jiuwenswarm-secret-configmap 与 ConfigMap jiuwenswarm-gateway-envfile 注入
#   - 数据卷挂载（profile 分层契约，见 jiuwenswarm/common/paths.py）：
#     · 共享卷 PVC gateway-pvc → /home/app/.jiuwenswarm/profile：统一用户数据目录，
#       gateway 各副本共享同一数据卷（application_plugins/（运维部署的应用插件）等
#       zone 级资产跨副本/跨 Pod 存活）；与 agentserver 数据卷相互独立
#   - 数据根 /home/app/.jiuwenswarm 自身不挂载（Pod 本地存储），仅 profile/ 经共享卷挂载
#   - 依赖前置：mariadb 已建库 gateway_<<NAMESPACE>> / web_<<NAMESPACE>>（utf8mb4）
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jiuwenswarm-gateway
  namespace: "<<NAMESPACE>>"
  labels:
    app: jiuwenswarm-gateway
spec:
  replicas: <<GATEWAY_REPLICAS>>
  selector:
    matchLabels:
      app: jiuwenswarm-gateway
  template:
    metadata:
      labels:
        app: jiuwenswarm-gateway
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - jiuwenswarm-gateway
              topologyKey: "kubernetes.io/hostname"
      containers:
        - name: gateway
          image: <<GATEWAY_IMAGE>>
          imagePullPolicy: IfNotPresent
          ports:
            - name: web-ws
              containerPort: 19000
            - name: http
              containerPort: 19001
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: web-ws
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: web-ws
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          envFrom:
            - secretRef:
                name: jiuwenswarm-secret-configmap
            - configMapRef:
                name: jiuwenswarm-gateway-envfile
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          volumeMounts:
            - name: gateway-data
              mountPath: /home/app/.jiuwenswarm/profile
      volumes:
        - name: gateway-data
          persistentVolumeClaim:
            claimName: gateway-pvc
---
# Service：提供稳定 DNS 域名，供集群内部访问
apiVersion: v1
kind: Service
metadata:
  name: jiuwenswarm-gateway
  namespace: "<<NAMESPACE>>"
spec:
  selector:
    app: jiuwenswarm-gateway
  ports:
    - name: web-ws
      port: 19000
      targetPort: 19000
    - name: http
      port: 19001
      targetPort: 19001
  type: ClusterIP
