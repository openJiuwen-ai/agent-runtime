apiVersion: apps/v1
kind: Deployment
metadata:
  name: <<MANAGER_WEB_NAME>>
  namespace: <<NAMESPACE>>
  labels:
    app: <<MANAGER_WEB_NAME>>
spec:
  replicas: <<MANAGER_WEB_REPLICAS>>
  selector:
    matchLabels:
      app: <<MANAGER_WEB_NAME>>
  template:
    metadata:
      labels:
        app: <<MANAGER_WEB_NAME>>
    spec:
      securityContext:
        fsGroup: 0
      containers:
        - name: manager-web
          image: <<MANAGER_WEB_IMAGE>>
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: <<MANAGER_WEB_PORT>>
              protocol: TCP
          env:
            - name: MANAGER_WEB_HOST
              value: "0.0.0.0"
            - name: MANAGER_WEB_PORT
              value: "<<MANAGER_WEB_PORT>>"
            - name: MANAGER_WEB_PROXY_TARGET
              value: "http://<<MANAGER_SERVER_NAME>>:<<MANAGER_REST_PORT>>"
            - name: MANAGER_WEB_IDP_TARGET
              value: "http://<<IDENTITY_NAME>>:<<IDENTITY_REST_PORT>>"
            # nginx 变量 proxy_pass 需要 resolver
            - name: MANAGER_WEB_RESOLVER
              value: "<<MANAGER_WEB_RESOLVER>>"
            - name: WORKSPACE_QUOTA_ENABLED
              value: "<<WORKSPACE_QUOTA_ENABLED>>"
            - name: TZ
              value: "<<TIMEZONE>>"

---
# NodePort Service：供外连接
apiVersion: v1
kind: Service
metadata:
  name: <<MANAGER_WEB_NAME>>-nodeport
  namespace: <<NAMESPACE>>
spec:
  type: NodePort
  ports:
    - name: http
      port: <<MANAGER_WEB_PORT>>
      targetPort: <<MANAGER_WEB_PORT>>
      nodePort: <<MANAGER_WEB_NODE_PORT>>
  selector:
    app: <<MANAGER_WEB_NAME>>
---
# HPA：MANAGER_WEB_HPA_ENABLED=true 时保留本段（副本数交由 HPA 管理，
# Deployment 固定 replicas 会被渲染流程删除）；false 时整段剔除。
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: <<MANAGER_WEB_NAME>>
  namespace: <<NAMESPACE>>
  labels:
    app: <<MANAGER_WEB_NAME>>
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: <<MANAGER_WEB_NAME>>
  minReplicas: <<MANAGER_WEB_HPA_MIN_REPLICAS>>
  maxReplicas: <<MANAGER_WEB_HPA_MAX_REPLICAS>>
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: <<MANAGER_WEB_HPA_TARGET_CPU>>
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: <<MANAGER_WEB_HPA_TARGET_MEM>>
