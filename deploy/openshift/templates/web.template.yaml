# jiuwenclaw-web 部署清单（镜像 <<WEB_IMAGE>>）
# 说明：
#   - 镜像基于 nginxinc/nginx-unprivileged，适配 restricted-v2 SCC（随机 uid，pid/temp 写 /tmp）
#   - OBS_URL 指向集群内 MinIO：minio.<<NAMESPACE>>:9000
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jiuwenclaw-web
  namespace: <<NAMESPACE>>
  labels:
    app: jiuwenclaw-web
spec:
  replicas: <<WEB_REPLICAS>>
  selector:
    matchLabels:
      app: jiuwenclaw-web
  template:
    metadata:
      labels:
        app: jiuwenclaw-web
    spec:
      containers:
        - name: web
          image: <<WEB_IMAGE>>
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5173
              protocol: TCP
            - name: websocket
              containerPort: 19000
              protocol: TCP
          envFrom:
            - secretRef:
                name: jiuwenclaw-secret-configmap
          env:
            - name: WEB_HTTP_PORT
              value: "5173"
            - name: JIUWENSWARM_EDITION
              value: "enterprise"
            - name: LOGIN_AUTH_SIMULATE
              value: "false"
            - name: WEB_TRANSPORT
              value: "http"
            - name: WEB_REQUEST_TIMEOUT_SECONDS
              value: "15"
            - name: WORKSPACE_QUOTA_ENABLED
              value: "false"
            - name: GATEWAY_URL
              value: "http://jiuwenclaw-gateway:19000"
            - name: GATEWAY_WEB_HTTP_URL
              value: "http://jiuwenclaw-gateway:19000"
            - name: TZ
              value: "Asia/Shanghai"
            - name: OBS_URL
              value: "minio.<<NAMESPACE>>:9000"
            - name: OBS_BUCKET
              value: "jiuwenclaw"
            - name: OBS_SECURE
              value: "false"
            - name: OBS_PUBLIC_BASE_URL
              value: ""
            - name: OBS_REGION
              value: "default"
---
# 集群内部访问：提供稳定 DNS 域名
apiVersion: v1
kind: Service
metadata:
  name: jiuwenclaw-web
  namespace: <<NAMESPACE>>
spec:
  selector:
    app: jiuwenclaw-web
  ports:
    - name: http
      port: 5173
      targetPort: 5173
    - name: websocket
      port: 19000
      targetPort: 19000
  type: ClusterIP
