  REDIS_PASSWORD: "Um9vdEAxMjM0NTY="
  OBS_SECRET_KEY: "Um9vdEAxMjM0NTY="
  AGENTSERVER_DB_PASSWORD: Um9vdEAxMjM0NTY=
