# jiuwenswarm 共用配置 Secret（各组件经 envFrom 注入）
# 说明：密码由 global_vars.sh 提供默认值（.env.custom 可覆盖）；
#   数据库 root 密码仅首次初始化生效，已初始化实例改密需同步 ALTER USER
apiVersion: v1
kind: Secret
metadata:
  name: jiuwenswarm-secret-configmap
  namespace: <<NAMESPACE>>
type: Opaque
stringData:
  # 基础组件自身启动所需（容器经 envFrom 读取）, 选填内容
  MARIADB_ROOT_PASSWORD: "<<MARIADB_ROOT_PASSWORD>>"
  MYSQL_ROOT_PASSWORD: "<<MYSQL_ROOT_PASSWORD>>"
  POSTGRES_PASSWORD: "<<POSTGRES_PASSWORD>>"
  MINIO_ROOT_USER: "<<MINIO_ROOT_USER>>"
  MINIO_ROOT_PASSWORD: "<<MINIO_ROOT_PASSWORD>>"
  # 消费方连接凭据，必填内容
  GATEWAY_DB_PASSWORD: "<<DB_ROOT_PASSWORD>>"
  MANAGER_DB_PASSWORD: "<<DB_ROOT_PASSWORD>>"
  IDENTITY_DB_PASSWORD: "<<DB_ROOT_PASSWORD>>"
  WEB_DB_PASSWORD: "<<DB_ROOT_PASSWORD>>"
  AGENTSERVER_DB_PASSWORD: "<<DB_ROOT_PASSWORD>>"
  OPENJIUWEN_SERVICE_DB_PASSWORD: "<<DB_ROOT_PASSWORD>>"
  REDIS_PASSWORD: "<<REDIS_PASSWORD>>"
  OBS_ACCESS_KEY: "<<OBS_ACCESS_KEY>>"
  OBS_SECRET_KEY: "<<OBS_SECRET_KEY>>"
