# jiuwenclaw-agentserver 部署清单（镜像 <<AGENTSERVER_IMAGE>>，与 gateway 同镜像）
# 说明：
#   - 镜像为 OpenShift 适配版，适配 restricted-v2 SCC（强制随机 uid，不指定 runAsUser/fsGroup）
#   - 配置经 Secret jiuwenclaw-secret-configmap 与 ConfigMap jiuwenclaw-agentserver-env 注入
#   - 数据卷挂载 PVC jiuwenclaw-pvc 至 /home/app/.jiuwenswarm
#   - 内部组件：gateway 经 AGENT_SERVER_URL 通过 ClusterIP Service 直连，不对外暴露
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jiuwenclaw-agentserver
  namespace: <<NAMESPACE>>
  labels:
    app: jiuwenclaw-agentserver
spec:
  replicas: <<AGENT_SERVER_REPLICAS>>
  selector:
    matchLabels:
      app: jiuwenclaw-agentserver
  template:
    metadata:
      labels:
        app: jiuwenclaw-agentserver
        jiuwenclaw-component: agentserver
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - jiuwenclaw-agentserver
                topologyKey: "kubernetes.io/hostname"
      containers:
        - name: jiuwenclaw-agentserver
          image: <<AGENTSERVER_IMAGE>>
          imagePullPolicy: IfNotPresent
          ports:
            - name: sse
              containerPort: 8766
            - name: ws
              containerPort: 18092
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: sse
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: sse
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 6
          envFrom:
            - secretRef:
                name: jiuwenclaw-secret-configmap
            - configMapRef:
                name: jiuwenclaw-agentserver-env
          volumeMounts:
            - name: data
              mountPath: /home/app/.jiuwenswarm
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: jiuwenclaw-pvc
---
# Service：提供稳定 DNS 域名，gateway 静态模式经 AGENT_SERVER_URL 直连
apiVersion: v1
kind: Service
metadata:
  name: jiuwenclaw-agentserver
  namespace: <<NAMESPACE>>
spec:
  selector:
    app: jiuwenclaw-agentserver
  ports:
    - name: sse
      port: 8766
      targetPort: sse
    - name: ws
      port: 18092
      targetPort: ws
  type: ClusterIP
