# MariaDB 部署清单（OpenShift）
# 说明：
#   - 存储类经 DATA_STORAGE_CLASS 变量配置（.env.custom，留空走集群默认）动态供给（WaitForFirstConsumer）
#   - 适配 restricted-v2 SCC：随机 uid 运行，fsGroup 由 SCC 自动注入
#   - 镜像经 MARIADB_IMAGE 变量配置（.env.custom）
# 访问：oc port-forward sts/mariadb 3306:3306
apiVersion: v1
kind: Service
metadata:
  name: mariadb-headless
  namespace: <<NAMESPACE>>
spec:
  ports:
    - port: 3306
      targetPort: 3306
  clusterIP: None
  selector:
    app: mariadb
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mariadb-pvc
  namespace: <<NAMESPACE>>
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 4Gi
  storageClassName: <<DATA_STORAGE_CLASS>>
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mariadb
  namespace: <<NAMESPACE>>
spec:
  serviceName: mariadb-headless
  replicas: 1
  selector:
    matchLabels:
      app: mariadb
  template:
    metadata:
      labels:
        app: mariadb
    spec:
      containers:
        - name: mariadb
          image: <<MARIADB_IMAGE>>
          imagePullPolicy: IfNotPresent
          args:
            - "--innodb_use_native_aio=0"
            - "--innodb_flush_method=O_DIRECT_NO_FSYNC"
            - "--max-connections=400"
            - "--sql-mode=PIPES_AS_CONCAT,ANSI_QUOTES,IGNORE_SPACE,ORACLE,NO_KEY_OPTIONS,NO_TABLE_OPTIONS,NO_FIELD_OPTIONS,STRICT_TRANS_TABLES,NO_AUTO_CREATE_USER,SIMULTANEOUS_ASSIGNMENT"
          env:
            - name: MARIADB_ROOT_PASSWORD
              value: "Root@123456"
            - name: TZ
              value: "Asia/Shanghai"
            - name: MARIADB_ROOT_HOST
              value: "%"
          ports:
            - containerPort: 3306
              name: mariadb
          volumeMounts:
            - name: mariadb-data
              mountPath: /var/lib/mysql
          livenessProbe:
            tcpSocket:
              port: 3306
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            tcpSocket:
              port: 3306
            initialDelaySeconds: 20
            periodSeconds: 5
            timeoutSeconds: 2
      volumes:
        - name: mariadb-data
          persistentVolumeClaim:
            claimName: mariadb-pvc