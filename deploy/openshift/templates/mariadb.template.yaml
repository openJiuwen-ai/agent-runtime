# MariaDB for OpenShift 试用集群（restricted-v2 SCC + gp3 动态供给）
# 相对 conf/mariadb.yaml 的适配点：
#   1. 资源显式指定 namespace: <<NAMESPACE>>，可直接 kubectl apply -f 使用（本环境需走 curl REST，见 docs/../../work-docs/dbs/试用集群基础服务的部署.md 2.2）
#   2. 无静态 NFS PV：PVC 走 gp3（EBS）动态供给；WaitForFirstConsumer——Pod 调度后才 Bound
#   3. nodePort 30001：30000 已被 mysql-nodeport 占用（NodePort 全集群唯一）
#   4. 不设置 fsGroup：restricted-v2 仅允许命名空间分配的组段（1008160000/10000），留空由 SCC 自动注入
#   5. 镜像沿用客户环境的 swr.cn-north-4 仓库（mariadb-amd64:11.8）；若节点拉取受限，回退 docker.io/library/mariadb:11.8
# 应用：kubectl apply --request-timeout=120s -f openshift/mariadb.yaml
# 访问：<节点IP>:30001，或临时 oc port-forward svc/mariadb-nodeport 3306:3306
apiVersion: v1
kind: Service
metadata:
  name: mariadb-headless
  namespace: <<NAMESPACE>>
spec:
  ports:
    - port: 3306
      targetPort: 3306
  clusterIP: None
  selector:
    app: mariadb
---
apiVersion: v1
kind: Service
metadata:
  name: mariadb-nodeport
  namespace: <<NAMESPACE>>
spec:
  type: NodePort
  ports:
    - port: 3306
      targetPort: 3306
      nodePort: 30001
  selector:
    app: mariadb
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mariadb-pvc
  namespace: <<NAMESPACE>>
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 4Gi
  storageClassName: gp3
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mariadb
  namespace: <<NAMESPACE>>
spec:
  serviceName: mariadb-headless
  replicas: 1
  selector:
    matchLabels:
      app: mariadb
  template:
    metadata:
      labels:
        app: mariadb
    spec:
      containers:
        - name: mariadb
          image: swr.cn-north-4.myhuaweicloud.com/openjiuwen/mariadb-amd64:11.8
          imagePullPolicy: IfNotPresent
          args:
            - "--innodb_use_native_aio=0"
            - "--innodb_flush_method=O_DIRECT_NO_FSYNC"
            - "--max-connections=400"
            - "--sql-mode=PIPES_AS_CONCAT,ANSI_QUOTES,IGNORE_SPACE,ORACLE,NO_KEY_OPTIONS,NO_TABLE_OPTIONS,NO_FIELD_OPTIONS,STRICT_TRANS_TABLES,NO_AUTO_CREATE_USER,SIMULTANEOUS_ASSIGNMENT"
          env:
            - name: MARIADB_ROOT_PASSWORD
              value: "Root@123456"
            - name: TZ
              value: "Asia/Shanghai"
            - name: MARIADB_ROOT_HOST
              value: "%"
          ports:
            - containerPort: 3306
              name: mariadb
          volumeMounts:
            - name: mariadb-data
              mountPath: /var/lib/mysql
          livenessProbe:
            tcpSocket:
              port: 3306
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            tcpSocket:
              port: 3306
            initialDelaySeconds: 20
            periodSeconds: 5
            timeoutSeconds: 2
      volumes:
        - name: mariadb-data
          persistentVolumeClaim:
            claimName: mariadb-pvc
