# jiuwenclaw-manager-web 部署清单（镜像 <<MANAGER_WEB_IMAGE>>，nginx 形态）
# 说明：
#   - 镜像基于 nginxinc/nginx-unprivileged，适配 restricted-v2 SCC（随机 uid，pid/temp 写 /tmp）
#   - MANAGER_WEB_RESOLVER 留空=按集群形态自动解析（openshift 用 OCP CoreDNS 服务名，k8s 取 ClusterIP）
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jiuwenclaw-manager-web
  namespace: <<NAMESPACE>>
  labels:
    app: jiuwenclaw-manager-web
spec:
  replicas: <<MANAGER_WEB_REPLICAS>>
  selector:
    matchLabels:
      app: jiuwenclaw-manager-web
  template:
    metadata:
      labels:
        app: jiuwenclaw-manager-web
    spec:
      containers:
        - name: manager-web
          image: <<MANAGER_WEB_IMAGE>>
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5273
              protocol: TCP
          env:
            - name: MANAGER_WEB_HOST
              value: "0.0.0.0"
            - name: MANAGER_WEB_PORT
              value: "5273"
            - name: MANAGER_WEB_PROXY_TARGET
              value: "http://jiuwenclaw-manager-server:8765"
            - name: MANAGER_WEB_IDP_TARGET
              value: "http://jiuwenclaw-identity:8770"
            # nginx 变量 proxy_pass 需要 resolver
            - name: MANAGER_WEB_RESOLVER
              value: "<<MANAGER_WEB_RESOLVER>>"
            - name: WORKSPACE_QUOTA_ENABLED
              value: "false"
            - name: TZ
              value: "Asia/Shanghai"
---
# Service：集群内 DNS
apiVersion: v1
kind: Service
metadata:
  name: jiuwenclaw-manager-web
  namespace: <<NAMESPACE>>
spec:
  selector:
    app: jiuwenclaw-manager-web
  ports:
    - name: http
      port: 5273
      targetPort: 5273
  type: ClusterIP
