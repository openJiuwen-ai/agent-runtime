# jiuwenclaw-manager-web 部署清单（镜像 <<MANAGER_WEB_IMAGE>>，nginx 形态）
# 说明：
#   - 镜像基于 nginxinc/nginx-unprivileged，适配 restricted-v2 SCC
#     （关键目录属主 101:0+g+w，pid/temp 位于 /tmp，随机 uid 直接可写，无需 emptyDir 顶替）
#   - MANAGER_WEB_RESOLVER 使用 OCP CoreDNS：dns-default.openshift-dns.svc.cluster.local
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jiuwenclaw-manager-web
  namespace: <<NAMESPACE>>
  labels:
    app: jiuwenclaw-manager-web
spec:
  replicas: <<MANAGER_WEB_REPLICAS>>
  selector:
    matchLabels:
      app: jiuwenclaw-manager-web
  template:
    metadata:
      labels:
        app: jiuwenclaw-manager-web
    spec:
      containers:
        - name: manager-web
          image: <<MANAGER_WEB_IMAGE>>
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5273
              protocol: TCP
          env:
            - name: MANAGER_WEB_HOST
              value: "0.0.0.0"
            - name: MANAGER_WEB_PORT
              value: "5273"
            - name: MANAGER_WEB_PROXY_TARGET
              value: "http://jiuwenclaw-manager-server:8765"
            - name: MANAGER_WEB_IDP_TARGET
              value: "http://jiuwenclaw-identity:8770"
            # nginx 变量 proxy_pass 需要 resolver
            - name: MANAGER_WEB_RESOLVER
              value: "dns-default.openshift-dns.svc.cluster.local"
            - name: WORKSPACE_QUOTA_ENABLED
              value: "false"
            - name: TZ
              value: "Asia/Shanghai"
---
# Service：提供稳定 DNS 域名（原 NodePort Service 已删，OpenShift 集群上不可达；
# 外部访问走 port-forward，见 README §4）
apiVersion: v1
kind: Service
metadata:
  name: jiuwenclaw-manager-web
  namespace: <<NAMESPACE>>
spec:
  selector:
    app: jiuwenclaw-manager-web
  ports:
    - name: http
      port: 5273
      targetPort: 5273
  type: ClusterIP
