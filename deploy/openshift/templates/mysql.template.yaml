# MySQL 部署清单（OpenShift）
# 说明：
#   - 存储走 gp3 StorageClass 动态供给；WaitForFirstConsumer——Pod 调度后才 Bound
#   - 适配 restricted-v2 SCC：随机 uid 运行，fsGroup 由 SCC 自动注入
#   - 镜像 mysql:8.0 为多架构镜像；节点拉取 docker.io 受限时请更换可用镜像源
# 访问：oc port-forward sts/mysql 3306:3306
apiVersion: v1
kind: Service
metadata:
  name: mysql-headless
  namespace: <<NAMESPACE>>
spec:
  ports:
    - port: 3306
      targetPort: 3306
  clusterIP: None
  selector:
    app: mysql
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-pvc
  namespace: <<NAMESPACE>>
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 4Gi
  storageClassName: gp3
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
  namespace: <<NAMESPACE>>
spec:
  serviceName: mysql-headless
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          imagePullPolicy: IfNotPresent
          args:
            - --innodb_use_native_aio=0
            - --innodb_flush_method=O_DIRECT_NO_FSYNC
            - --max-connections=400
          env:
            - name: MYSQL_ROOT_PASSWORD
              value: "Root@123456"
            - name: TZ
              value: "Asia/Shanghai"
            - name: MYSQL_ROOT_HOST
              value: "%"
          ports:
            - containerPort: 3306
              name: mysql
          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql
          livenessProbe:
            tcpSocket:
              port: 3306
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            tcpSocket:
              port: 3306
            initialDelaySeconds: 20
            periodSeconds: 5
            timeoutSeconds: 2
      volumes:
        - name: mysql-data
          persistentVolumeClaim:
            claimName: mysql-pvc
