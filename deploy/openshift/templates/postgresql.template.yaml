# PostgreSQL 部署清单（OpenShift）
# 说明：
#   - 存储类经 DATA_STORAGE_CLASS 变量配置（.env.custom，留空走集群默认）动态供给（WaitForFirstConsumer）
#   - 适配 restricted-v2 SCC：随机 uid 运行，fsGroup 由 SCC 注入；emptyDir 挂载 /var/run/postgresql（socket 目录）
#   - 镜像经 POSTGRESQL_IMAGE 变量配置（.env.custom）
# 访问：kubectl port-forward sts/postgresql 5433:5432
#       psql -h 127.0.0.1 -p 5433 -U postgres（密码见 POSTGRES_PASSWORD）
apiVersion: v1
kind: Service
metadata:
  name: postgresql-headless
  namespace: <<NAMESPACE>>
spec:
  ports:
    - port: 5432
      targetPort: 5432
  clusterIP: None
  selector:
    app: postgresql
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgresql-pvc
  namespace: <<NAMESPACE>>
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 4Gi
  storageClassName: <<DATA_STORAGE_CLASS>>
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgresql
  namespace: <<NAMESPACE>>
spec:
  serviceName: postgresql-headless
  replicas: 1
  selector:
    matchLabels:
      app: postgresql
  template:
    metadata:
      labels:
        app: postgresql
    spec:
      containers:
        - name: postgresql
          image: <<POSTGRESQL_IMAGE>>
          imagePullPolicy: IfNotPresent
          args:
            - -c
            - max_connections=192
          envFrom:
            - secretRef:
                name: jiuwenswarm-secret-configmap
          env:
            - name: POSTGRES_HOST_AUTH_METHOD
              value: "scram-sha-256"
            - name: TZ
              value: "Asia/Shanghai"
            - name: PGDATA
              value: "/var/lib/postgresql/data/pgdata"
          ports:
            - containerPort: 5432
              name: postgresql
          volumeMounts:
            - name: postgresql-data
              mountPath: /var/lib/postgresql/data
            - name: postgresql-run
              mountPath: /var/run/postgresql
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
      volumes:
        - name: postgresql-data
          persistentVolumeClaim:
            claimName: postgresql-pvc
        - name: postgresql-run
          emptyDir: {}