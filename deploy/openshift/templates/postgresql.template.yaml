# PostgreSQL 部署清单（OpenShift）
# 说明：
#   - 存储走 gp3 StorageClass 动态供给；WaitForFirstConsumer——Pod 调度后才 Bound
#   - 适配 restricted-v2 SCC：随机 uid 运行，fsGroup 由 SCC 注入；
#     emptyDir 挂载 /var/run/postgresql（socket 目录，随机 uid 无法写镜像内 root 属主目录）
#   - 镜像 swr.cn-north-4.myhuaweicloud.com/openjiuwen/postgres-amd64:16；
#     节点拉取受限时可回退 docker.io/library/postgres:16
# 访问：kubectl port-forward sts/postgresql 5433:5432
#       psql -h 127.0.0.1 -p 5433 -U postgres（密码 Root@123456）
apiVersion: v1
kind: Service
metadata:
  name: postgresql-headless
  namespace: <<NAMESPACE>>
spec:
  ports:
    - port: 5432
      targetPort: 5432
  clusterIP: None
  selector:
    app: postgresql
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgresql-pvc
  namespace: <<NAMESPACE>>
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 4Gi
  storageClassName: gp3
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgresql
  namespace: <<NAMESPACE>>
spec:
  serviceName: postgresql-headless
  replicas: 1
  selector:
    matchLabels:
      app: postgresql
  template:
    metadata:
      labels:
        app: postgresql
    spec:
      containers:
        - name: postgresql
          image: swr.cn-north-4.myhuaweicloud.com/openjiuwen/postgres-amd64:16
          imagePullPolicy: IfNotPresent
          args:
            - -c
            - max_connections=192
          env:
            - name: POSTGRES_PASSWORD
              value: "Root@123456"
            - name: POSTGRES_HOST_AUTH_METHOD
              value: "scram-sha-256"
            - name: TZ
              value: "Asia/Shanghai"
            - name: PGDATA
              value: "/var/lib/postgresql/data/pgdata"
          ports:
            - containerPort: 5432
              name: postgresql
          volumeMounts:
            - name: postgresql-data
              mountPath: /var/lib/postgresql/data
            - name: postgresql-run
              mountPath: /var/run/postgresql
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
      volumes:
        - name: postgresql-data
          persistentVolumeClaim:
            claimName: postgresql-pvc
        - name: postgresql-run
          emptyDir: {}
