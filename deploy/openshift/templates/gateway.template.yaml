# jiuwenclaw-gateway 部署清单（镜像 <<GATEWAY_IMAGE>>）
# 说明：
#   - 镜像为 OpenShift 适配版，适配 restricted-v2 SCC（强制随机 uid，不指定 runAsUser/fsGroup）
#   - 配置经 Secret jiuwenclaw-secret-configmap 与 ConfigMap jiuwenclaw-gateway-envfile 注入
#   - 依赖前置：mariadb 已建库 gateway_<<NAMESPACE>> / web_<<NAMESPACE>>（utf8mb4）
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jiuwenclaw-gateway
  namespace: <<NAMESPACE>>
  labels:
    app: jiuwenclaw-gateway
spec:
  replicas: <<GATEWAY_REPLICAS>>
  selector:
    matchLabels:
      app: jiuwenclaw-gateway
  template:
    metadata:
      labels:
        app: jiuwenclaw-gateway
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - jiuwenclaw-gateway
              topologyKey: "kubernetes.io/hostname"
      containers:
        - name: gateway
          image: <<GATEWAY_IMAGE>>
          imagePullPolicy: IfNotPresent
          ports:
            - name: web-ws
              containerPort: 19000
            - name: http
              containerPort: 19001
          readinessProbe:
            httpGet:
              path: /api/v1/ready
              port: web-ws
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: web-ws
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          envFrom:
            - secretRef:
                name: jiuwenclaw-secret-configmap
            - configMapRef:
                name: jiuwenclaw-gateway-envfile
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
---
# Service：提供稳定 DNS 域名，供集群内部访问
apiVersion: v1
kind: Service
metadata:
  name: jiuwenclaw-gateway
  namespace: <<NAMESPACE>>
spec:
  selector:
    app: jiuwenclaw-gateway
  ports:
    - name: web-ws
      port: 19000
      targetPort: 19000
    - name: http
      port: 19001
      targetPort: 19001
  type: ClusterIP
