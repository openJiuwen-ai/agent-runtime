# jiuwenswarm-identity 部署清单（镜像 <<IDENTITY_IMAGE>>）
# 说明：
#   - 镜像为 OpenShift 适配版，适配 restricted-v2 SCC（强制随机 uid，不指定 runAsUser/fsGroup）
#   - 依赖前置：mariadb 已建库 identity_<<NAMESPACE>>（utf8mb4）
apiVersion: v1
kind: Service
metadata:
  name: jiuwenswarm-identity
  namespace: <<NAMESPACE>>
spec:
  selector:
    app: jiuwenswarm-identity
  ports:
    - name: rest
      port: 8770
      targetPort: 8770
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jiuwenswarm-identity
  namespace: <<NAMESPACE>>
spec:
  replicas: <<IDENTITY_REPLICAS>>
  selector:
    matchLabels:
      app: jiuwenswarm-identity
  template:
    metadata:
      labels:
        app: jiuwenswarm-identity
    spec:
      containers:
        - name: jiuwenswarm-identity
          image: <<IDENTITY_IMAGE>>
          imagePullPolicy: IfNotPresent
          ports:
            - name: rest
              containerPort: 8770
          envFrom:
            - secretRef:
                name: jiuwenswarm-secret-configmap
          env:
            - name: IDENTITY_REST_HOST
              value: "0.0.0.0"
            - name: IDENTITY_REST_PORT
              value: "8770"
            - name: IDENTITY_DB_HOST
              value: "<<DB_HOST>>"
            - name: IDENTITY_DB_PORT
              value: "<<DB_PORT>>"
            - name: IDENTITY_DB_TYPE
              value: "<<DB_TYPE>>"
            - name: IDENTITY_DB_USER
              value: "<<IDENTITY_DB_USER>>"
            - name: IDENTITY_DB_NAME
              value: "<<IDENTITY_DB_NAME>>"
            - name: IDENTITY_PG_SCHEMA
              value: "<<IDENTITY_PG_SCHEMA>>"
            - name: IDENTITY_SEED_ADMIN
              value: "true"
            - name: IDENTITY_SEED_USER1
              value: "true"
            - name: IDENTITY_FEDERATION_DEMO_ENABLED
              value: "false"
            - name: IDENTITY_SSO_SERVER_URL
              value: "<<IDENTITY_SSO_SERVER_URL>>"
            - name: IDENTITY_SSO_LOGIN_CLIENT_ID
              value: "<<IDENTITY_SSO_LOGIN_CLIENT_ID>>"
            - name: IDENTITY_SSO_TOKEN_AUDIENCE
              value: "<<IDENTITY_SSO_TOKEN_AUDIENCE>>"
            - name: IDENTITY_FEDERATION_CONFIG_FILE
              value: "<<IDENTITY_FEDERATION_CONFIG_FILE>>"
            - name: IDENTITY_FEDERATION_PUBLIC_PATH_PREFIX
              value: "/idp"
            - name: IDENTITY_FEDERATION_REQUEST_TTL
              value: "300"
            - name: IDENTITY_FEDERATION_CODE_TTL
              value: "60"
            - name: IDENTITY_FEDERATION_DEMO_ADMIN_GROUP
              value: "enterprise-admins"
            - name: TZ
              value: "Asia/Shanghai"
            - name: IDENTITY_ADMIN_PASSWORD
              value: admin
            - name: IDENTITY_USER1_PASSWORD
              value: user1
