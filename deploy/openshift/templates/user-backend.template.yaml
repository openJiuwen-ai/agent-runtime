apiVersion: v1
kind: Secret
metadata:
  name: jiuwenswarm-user-backend-db
  namespace: <<NAMESPACE>>
type: Opaque
data:
  USER_BACKEND_DB_PASSWORD: "<<USER_BACKEND_DB_PASSWORD_ENCODED>>"
---
apiVersion: v1
kind: Service
metadata:
  name: jiuwenswarm-user-backend
  namespace: <<NAMESPACE>>
spec:
  selector:
    app: jiuwenswarm-user-backend
  ports:
    - name: http
      port: 8780
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jiuwenswarm-user-backend
  namespace: <<NAMESPACE>>
spec:
  replicas: <<USER_BACKEND_REPLICAS>>
  selector:
    matchLabels:
      app: jiuwenswarm-user-backend
  template:
    metadata:
      labels:
        app: jiuwenswarm-user-backend
    spec:
      automountServiceAccountToken: false
      containers:
        - name: user-backend
          image: <<USER_BACKEND_IMAGE>>
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8780
          env:
            - name: JIUWENSWARM_EDITION
              value: "enterprise"
            - name: USER_BACKEND_DB_USER
              value: "<<USER_BACKEND_DB_USER>>"
            - name: USER_BACKEND_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: jiuwenswarm-user-backend-db
                  key: USER_BACKEND_DB_PASSWORD
            - name: USER_BACKEND_DB_TYPE
              value: "<<DB_TYPE>>"
            - name: USER_BACKEND_DB_HOST
              value: "<<DB_HOST>>"
            - name: USER_BACKEND_DB_PORT
              value: "<<DB_PORT>>"
            - name: USER_BACKEND_DB_NAME
              value: "<<MANAGER_DB_NAME>>"
            - name: USER_BACKEND_PG_SCHEMA
              value: "<<MANAGER_PG_SCHEMA>>"
            - name: USER_BACKEND_IDENTITY_URL
              value: "http://jiuwenswarm-identity:8770"
            - name: USER_BACKEND_MANAGER_URL
              value: "http://jiuwenswarm-manager-server:8765"
            - name: USER_BACKEND_DEFAULT_GATEWAY_HTTP
              value: "http://jiuwenswarm-gateway:19000"
            - name: USER_BACKEND_DEFAULT_GATEWAY_WS
              value: "http://jiuwenswarm-gateway:19000"
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 7
          livenessProbe:
            httpGet:
              path: /health
              port: http
