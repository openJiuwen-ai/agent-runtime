# MinIO 部署清单（OpenShift）
# 说明：
#   - 存储类经 DATA_STORAGE_CLASS 变量配置（.env.custom，留空走集群默认）挂 /data；Deployment + Recreate（RWO 卷）
#   - root 凭证经 env 指定：minioadmin / Root@123456；适配 restricted-v2 SCC（fsGroup 由 SCC 自动注入）
#   - 镜像经 MINIO_IMAGE 变量配置（.env.custom）
# 访问：oc port-forward svc/minio 9000:9000（S3 API）、9001:9001（Console）
# 凭证：minioadmin / Root@123456
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: <<NAMESPACE>>
spec:
  ports:
    - name: api
      port: 9000
      targetPort: 9000
    - name: console
      port: 9001
      targetPort: 9001
  selector:
    app: minio
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio-pvc
  namespace: <<NAMESPACE>>
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: <<DATA_STORAGE_CLASS>>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: <<NAMESPACE>>
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      containers:
        - name: minio
          image: <<MINIO_IMAGE>>
          imagePullPolicy: IfNotPresent
          args:
            - server
            - /data
            - --console-address
            - ":9001"
          env:
            - name: MINIO_ROOT_USER
              value: "minioadmin"
            - name: MINIO_ROOT_PASSWORD
              value: "Root@123456"
          ports:
            - containerPort: 9000
              name: api
            - containerPort: 9001
              name: console
          volumeMounts:
            - name: minio-data
              mountPath: /data
          livenessProbe:
            tcpSocket:
              port: 9000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            tcpSocket:
              port: 9000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
      volumes:
        - name: minio-data
          persistentVolumeClaim:
            claimName: minio-pvc
---
# Route：MinIO Console 管理界面（9001）
# openshift 独有资源；k8s 形态由 k8s_handler.apply_k8s_extras 剥离，改用 NodePort
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: minio
  namespace: <<NAMESPACE>>
spec:
  port:
    targetPort: console
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  to:
    kind: Service
    name: minio
    weight: 100
  wildcardPolicy: None
---
# Route：MinIO S3 API（9000，浏览器预签名 URL / 直传场景）
# openshift 独有资源；k8s 形态由 k8s_handler.apply_k8s_extras 剥离，改用 NodePort
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: minio-api
  namespace: <<NAMESPACE>>
spec:
  port:
    targetPort: api
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  to:
    kind: Service
    name: minio
    weight: 100
  wildcardPolicy: None
