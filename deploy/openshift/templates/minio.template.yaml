# MinIO 部署清单（OpenShift）
# 说明：
#   - 存储类经 DATA_STORAGE_CLASS 变量配置（.env.custom，留空走集群默认）挂 /data；Deployment + Recreate（RWO 卷）
#   - root 凭证经 jiuwenclaw-secret-configmap 注入；适配 restricted-v2 SCC（fsGroup 由 SCC 自动注入）
#   - 镜像经 MINIO_IMAGE 变量配置（.env.custom）
# 访问：oc port-forward svc/minio 9000:9000（S3 API）、9001:9001（Console）
# 凭证：见 jiuwenclaw-secret-configmap（MINIO_ROOT_USER / MINIO_ROOT_PASSWORD）
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: <<NAMESPACE>>
spec:
  ports:
    - name: api
      port: 9000
      targetPort: 9000
    - name: console
      port: 9001
      targetPort: 9001
  selector:
    app: minio
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio-pvc
  namespace: <<NAMESPACE>>
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: <<DATA_STORAGE_CLASS>>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: <<NAMESPACE>>
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      containers:
        - name: minio
          image: <<MINIO_IMAGE>>
          imagePullPolicy: IfNotPresent
          args:
            - server
            - /data
            - --console-address
            - ":9001"
          envFrom:
            - secretRef:
                name: jiuwenclaw-secret-configmap
          ports:
            - containerPort: 9000
              name: api
            - containerPort: 9001
              name: console
          volumeMounts:
            - name: minio-data
              mountPath: /data
          livenessProbe:
            tcpSocket:
              port: 9000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            tcpSocket:
              port: 9000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
      volumes:
        - name: minio-data
          persistentVolumeClaim:
            claimName: minio-pvc