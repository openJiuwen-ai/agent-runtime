# MinIO 部署清单（OpenShift）
# 说明：
#   - 存储走 gp3 StorageClass 动态供给挂 /data；Deployment + Recreate 策略（RWO 卷限制单节点挂载）
#   - root 凭证经 env 指定：minioadmin / Root@123456；适配 restricted-v2 SCC（fsGroup 由 SCC 自动注入）
#   - 镜像使用 quay.io/minio/aistor/minio（公开仓库），锁定 RELEASE.2026-09-19T17-05-25Z
# 访问：oc port-forward svc/minio 9000:9000（S3 API）、9001:9001（Console）
# 凭证：minioadmin / Root@123456
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: <<NAMESPACE>>
spec:
  ports:
    - name: api
      port: 9000
      targetPort: 9000
    - name: console
      port: 9001
      targetPort: 9001
  selector:
    app: minio
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio-pvc
  namespace: <<NAMESPACE>>
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: gp3
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: <<NAMESPACE>>
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      containers:
        - name: minio
          image: quay.io/minio/aistor/minio:RELEASE.2026-09-19T17-05-25Z
          imagePullPolicy: IfNotPresent
          args:
            - server
            - /data
            - --console-address
            - ":9001"
          env:
            - name: MINIO_ROOT_USER
              value: "minioadmin"
            - name: MINIO_ROOT_PASSWORD
              value: "Root@123456"
          ports:
            - containerPort: 9000
              name: api
            - containerPort: 9001
              name: console
          volumeMounts:
            - name: minio-data
              mountPath: /data
          livenessProbe:
            tcpSocket:
              port: 9000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            tcpSocket:
              port: 9000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
      volumes:
        - name: minio-data
          persistentVolumeClaim:
            claimName: minio-pvc
