# jiuwenclaw 共享工作区 PVC（agentserver 等组件共享挂载）
# 说明：storageClassName 为 efs-sc（EFS AccessPoint）；ReadWriteMany 支持多副本/多组件跨节点共享
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jiuwenclaw-pvc
  namespace: <<NAMESPACE>>
spec:
  storageClassName: efs-sc
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 1Gi
