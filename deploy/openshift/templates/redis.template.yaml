# Redis for OpenShift 试用集群（restricted-v2 SCC + gp3 动态供给）
# 相对 conf/redis.yaml 的适配点：
#   1. 资源显式指定 namespace: <<NAMESPACE>>；本环境部署走 curl REST（见 work-docs/dbs/试用集群基础服务的部署.md 2.2）
#   2. 无静态存储依赖：PVC 走 gp3（EBS）动态供给挂 /data（appendonly 持久化）；Deployment + Recreate（RWO 单挂）
#   3. nodePort 30002：30000/30001 已被 mysql/mariadb 占用（NodePort 全集群唯一）
#   4. 补充 --requirepass（试用集群共享环境，裸奔不安全）；不设置 fsGroup，由 SCC 自动注入
#   5. 镜像 docker.io redis:7-alpine（多架构，amd64 可用；docker.io 拉取已实测可达）
# 应用：kubectl apply --request-timeout=120s -f openshift/redis.yaml
# 访问：oc port-forward svc/redis-nodeport 6379:6379，redis-cli -a Root@123456
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: <<NAMESPACE>>
spec:
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
  selector:
    app: redis
---
apiVersion: v1
kind: Service
metadata:
  name: redis-nodeport
  namespace: <<NAMESPACE>>
spec:
  type: NodePort
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
      nodePort: 30002
  selector:
    app: redis
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-pvc
  namespace: <<NAMESPACE>>
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
  storageClassName: gp3
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: <<NAMESPACE>>
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          args:
            - redis-server
            - --appendonly
            - "yes"
            - --requirepass
            - "Root@123456"
          ports:
            - containerPort: 6379
              name: redis
          volumeMounts:
            - name: redis-data
              mountPath: /data
          livenessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
      volumes:
        - name: redis-data
          persistentVolumeClaim:
            claimName: redis-pvc
