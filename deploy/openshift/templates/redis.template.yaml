# Redis 部署清单（OpenShift）
# 纯缓存用途，不挂持久卷；ACL 业务用户认证（default 用户禁用）；适配 restricted-v2 SCC
# 访问：oc port-forward svc/redis 6379:6379，redis-cli --user $REDIS_USER -a $REDIS_PASSWORD（密码见 global_vars）
#      （default 用户已禁用，仅 -a 不带用户名会认证失败）
apiVersion: v1
kind: Service
metadata:
  name: jiuwenswarm-redis
  namespace: <<NAMESPACE>>
spec:
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
  selector:
    app: jiuwenswarm-redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jiuwenswarm-redis
  namespace: <<NAMESPACE>>
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jiuwenswarm-redis
  template:
    metadata:
      labels:
        app: jiuwenswarm-redis
    spec:
      containers:
        - name: redis
          image: <<REDIS_IMAGE>>
          imagePullPolicy: IfNotPresent
          args:
            - redis-server
            # 禁用 RDB 快照：不挂持久卷（纯缓存），且 /data 属镜像层，随机 UID 不可写，
            # 默认 save 策略会 BGSAVE 失败 → MISCONF 拒写
            - --save
            - ""
            # ACL：禁用 default 用户（不能用 --requirepass 替代，它会隐式重新启用 default）；
            # 值必须加引号：裸写的 on 会被 kubectl 解析为 bool，> 开头会直接导致 YAML 解析失败
            - --user
            - "default"
            - "off"
            - --user
            - "<<REDIS_USER>>"
            - "on"
            - "><<REDIS_PASSWORD>>"
            - "~*"
            - "&*"
            - "+@all"
          ports:
            - containerPort: 6379
              name: redis
          livenessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
