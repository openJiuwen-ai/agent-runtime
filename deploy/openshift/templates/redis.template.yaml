# Redis 部署清单（OpenShift）
# 纯缓存用途，不挂持久卷；--requirepass 密码 Root@123456；适配 restricted-v2 SCC
# 访问：oc port-forward svc/redis 6379:6379，redis-cli -a Root@123456
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: <<NAMESPACE>>
spec:
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
  selector:
    app: redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: <<NAMESPACE>>
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: <<REDIS_IMAGE>>
          imagePullPolicy: IfNotPresent
          args:
            - redis-server
            - --requirepass
            - "Root@123456"
          ports:
            - containerPort: 6379
              name: redis
          livenessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
