# jiuwenclaw-manager-server 部署清单（镜像 <<MANAGER_SERVER_IMAGE>>）
# 说明：
#   - 镜像为 OpenShift 适配版，适配 restricted-v2 SCC（强制随机 uid，不指定 runAsUser/fsGroup）
#   - redis 连接：REDIS_URL 内嵌 URL 编码后的访问密码（@ → %40）
#   - 依赖前置：mariadb 已建库 manager_<<NAMESPACE>>（utf8mb4）；identity 先行部署（公钥经
#     IDENTITY_PUBLIC_KEY_URL 拉取）
# Service：提供稳定 DNS 域名，供集群内部访问
apiVersion: v1
kind: Service
metadata:
  name: jiuwenclaw-manager-server
  namespace: <<NAMESPACE>>
spec:
  selector:
    app: jiuwenclaw-manager-server
  ports:
    - name: rest
      port: 8765
      targetPort: 8765
    - name: websocket
      port: 8766
      targetPort: 8766
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jiuwenclaw-manager-server
  namespace: <<NAMESPACE>>
spec:
  replicas: <<MANAGER_SERVER_REPLICAS>>
  selector:
    matchLabels:
      app: jiuwenclaw-manager-server
  template:
    metadata:
      labels:
        app: jiuwenclaw-manager-server
    spec:
      containers:
      - name: manager
        image: <<MANAGER_SERVER_IMAGE>>
        imagePullPolicy: IfNotPresent
        ports:
        - name: rest
          containerPort: 8765
        - name: websocket
          containerPort: 8766
        envFrom:
            - secretRef:
                name: jiuwenclaw-secret-configmap
        env:
        - name: REDIS_URL
          value: "<<REDIS_URL>>"  # 凭据经 REDIS_USER/REDIS_PASSWORD 注入
        - name: REDIS_USER
          value: "<<REDIS_USER>>"
        - name: REDIS_KEY_PREFIX
          value: "<<REDIS_KEY_PREFIX>>"
        - name: MANAGER_RABBITMQ_URL
          value: ""
        - name: MANAGER_REST_HOST
          value: "0.0.0.0"
        - name: MANAGER_REST_PORT
          value: "8765"
        - name: MANAGER_DB_TYPE
          value: "<<DB_TYPE>>"
        - name: MANAGER_DB_HOST
          value: "<<DB_HOST>>"
        - name: MANAGER_DB_PORT
          value: "<<DB_PORT>>"
        - name: MANAGER_DB_USER
          value: "<<DB_USER>>"
        - name: MANAGER_DB_NAME
          value: "manager_<<NAMESPACE>>"
        - name: IDENTITY_PUBLIC_KEY_URL
          value: "http://jiuwenclaw-identity:8770/v1/auth/public_key"
        # 三模式部署形态（off 时 manager 跳过 Runtime 探活；routing/full 探活 agent-runtime /healthz）
        - name: AGENT_RUNTIME_DEPLOY_MODE
          value: "<<AGENT_RUNTIME_DEPLOY_MODE>>"
        # routing 模式：外部 AgentServer Pod 的 headless DNS 清单（manager 据此注册，
        # 与 StatefulSet 副本数同源；off/full 为空）
        - name: AGENTSERVER_POD_DNS_LIST
          value: "<<AGENTSERVER_POD_DNS_LIST>>"
        # MANAGER_WEB_*_TARGET 为 manager-web nginx 的 proxy_pass 上游（nginx 要求 FQDN）
        - name: MANAGER_WEB_USER_WEB_TARGET
          value: "http://jiuwenclaw-web.<<NAMESPACE>>.svc.cluster.local:5173"
        - name: MANAGER_WEB_GATEWAY_HTTP_TARGET
          value: "http://jiuwenclaw-gateway.<<NAMESPACE>>.svc.cluster.local:19000"
        - name: MANAGER_WEB_GATEWAY_WS_TARGET
          value: "http://jiuwenclaw-gateway.<<NAMESPACE>>.svc.cluster.local:19000"
        - name: NAMESPACE
          value: "<<NAMESPACE>>"
        - name: AGENT_RUNTIME_SYNC_TIMEOUT
          value: "10"
        - name: WORKSPACE_QUOTA_ENABLED
          value: "false"
        - name: MANAGER_WS_ENABLED
          value: "true"
        - name: MANAGER_WS_HOST
          value: "0.0.0.0"
        - name: MANAGER_WS_PORT
          value: "8766"
        - name: TZ
          value: "Asia/Shanghai"
