version: 1
disable_existing_loggers: false

formatters:
  standard:
    format: "%(asctime)s - %(levelname)s - %(name)s - %(filename)s:%(lineno)d - %(funcName)s - %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"

handlers:
  console:
    class: logging.StreamHandler
    level: INFO
    formatter: standard
    stream: ext://sys.stdout

  file:
    class: openjiuwen_runtime.foundation.log.handler.CompressedRotatingFileHandler
    level: DEBUG
    formatter: standard
    filename: logs/deployment_service.log
    maxBytes: 1048
    backupCount: 20
    encoding: utf-8

root:
  level: DEBUG
  handlers: [console, file]
