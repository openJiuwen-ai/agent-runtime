version: 1
disable_existing_loggers: false

formatters:
  standard:
    format: "%(asctime)s - %(levelname)s - %(name)s - %(filename)s:%(lineno)d - %(funcName)s - %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"

handlers:
  console:
    class: logging.StreamHandler
    level: INFO
    formatter: standard
    stream: ext://sys.stdout

  file:
    class: openjiuwen_runtime.foundation.log.handler.CompressedRotatingFileHandler
    level: INFO
    formatter: standard
    # 相对路径基于进程 cwd；可通过 OPENJIUWEN_RUNTIME_LOG_FILE / OPENJIUWEN_RUNTIME_LOG_DIR 覆盖
    filename: logs/deployment_service.log
    maxBytes: 10485760
    backupCount: 20
    encoding: utf-8

root:
  level: INFO
  handlers: [console, file]
