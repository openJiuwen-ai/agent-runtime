[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openjiuwen-runtime-foundation"
version = "0.1.0"
description = "OpenJiuwen Runtime"
requires-python = ">=3.11.4"
dependencies = [
    # service
    "build>=1.0.0",
    "aiohttp>=3.9.0",
    # config
    "pyyaml>=6.0",
    # db
    "sqlalchemy==2.0.41",
    "greenlet>=3.0.0",
    "pymysql==1.1.1",
    "cryptography>=42.0.0",
    "pydantic==2.11.7",
    "pydantic-settings==2.5.2",
    "aiomysql==0.2.0",
    "aiosqlite==0.21.0",
    "redis==7.1.0",
    # lint
    "ruff==0.9.10",
]

[tool.uv]
default-groups = ['dev']

[dependency-groups]
dev = [
    # test
    "coverage==7.8.0",
    "pytest==8.3.5",
    "pytest-asyncio==1.2.0",
    "pytest-mock==3.14.0",
]

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"

[tool.setuptools.packages.find]
where = ["."]
exclude = ["*.egg-info", "tests"]
include = ["openjiuwen_runtime*"]
	 
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
